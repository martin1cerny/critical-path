<head>

  <meta name="keywords" content="metoda kritické cesty, CPM, plánování projektů, Ganttův diagram, síťový diagram, projektové řízení, plánování zdrojů" />
  <meta property="og:title" content="CPM — Nástroj pro analýzu kritické cesty" />
  <meta property="og:description" content="Bezplatné plánování projektů v prohlížeči s analýzou CPM, Ganttovými diagramy, síťovými diagramy a exportem do Excelu." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f8fafc;
      color: #1e293b;
    }
    #root { min-height: 100vh; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotFadeIn {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes typeIn {
      from { max-width: 0; }
      to { max-width: 8ch; }
    }
  </style>
  <!-- Anchor all relative URLs (the scripts below) to the app root directory.
       On GitHub Pages index.html is always loaded at the site root, so the
       current pathname's directory IS the app root. This must run before the
       deep-link restore rewrites the URL, so assets keep resolving correctly
       for nested routes. Works at the domain root and at any subpath. -->
  <script>
    document.write('<base href="' + location.pathname.replace(/[^/]*$/, "") + '">');
  </script>
  <!-- GitHub Pages SPA deep-link restore: 404.html redirects /base/foo -> /base/?/foo,
       and this rewrites the address back to /base/foo before the app router loads. -->
  <script>
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search.slice(1).split("&").map(function (s) {
          return s.replace(/~and~/g, "&");
        }).join("?");
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
  <script src="i18n-cs.js"></script>
  <script type="module" crossorigin src="assets/index-BzlwJn9O.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
